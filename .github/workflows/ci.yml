name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install X stack (Xvfb hosts :99; launch_app nests Xephyr inside it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xserver-xephyr xdotool x11-utils x11-xkb-utils x11-xserver-utils xclip openbox wmctrl \
            tesseract-ocr xfonts-base \
            dbus at-spi2-core python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 libxkbcommon-x11-0
      - name: Install package + dev deps (+ basic vision so the OCR path is tested)
        run: pip install -e ".[dev,basic]"
      - name: Compile check
        run: python -m compileall -q server.py vision.py vision_service.py host_bridge.py a11y.py a11y_focus.py a11y_tree.py container.py _paths.py _version.py
      - name: Vision self-check (no GPU here -> must resolve to basic, not crash)
        run: python vision.py check
      - name: Run tests (smoke + display e2e)
        run: pytest -v
      - name: Upload frames + app logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glovebox-frames-py${{ matrix.python-version }}
          path: /tmp/glovebox-*/
          if-no-files-found: ignore

  container:
    # Container mode, on both architectures people run Docker on (arm64 = Apple Silicon hosts):
    # build the image, then a real MCP session through container.py into it.
    # The third leg builds the full app set and shares a (fake, GPU-less) host vision service
    # into the container: the mount, the socket link and the protocol are what it proves.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, apps: browser, vision: ""}
          - {runner: ubuntu-24.04-arm, apps: browser, vision: ""}
          - {runner: ubuntu-latest, apps: full, vision: host}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the image (apps: ${{ matrix.apps }})
        run: docker build -t glovebox-mcp:local --build-arg APPS=${{ matrix.apps }} .
      - name: MCP client for the smoke test (the server itself runs in the container)
        run: pip install "mcp[cli]>=2.0,<3" Pillow
      - name: A stand-in for the host's GPU vision service
        if: matrix.vision == 'host'
        run: python vision_service.py start --fake --idle-min 30
      - name: Smoke test through the launcher
        env:
          GLOVEBOX_CONTAINER: glovebox-ci
          GLOVEBOX_DATA: ${{ runner.temp }}/glovebox-data
          GLOVEBOX_APPS: ${{ matrix.apps }}
          GLOVEBOX_CONTAINER_VISION: ${{ matrix.vision }}
        run: python tests/container_smoke.py
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs glovebox-ci || true
          docker exec glovebox-ci sh -c 'tail -n 40 /tmp/*.log /tmp/glovebox-*/*.log' || true
