name: Publish container image

# Manual only, on purpose: pushing an image to a public registry is a decision, not a side
# effect of a release. Run it from the Actions tab (or `gh workflow run docker-publish.yml`)
# with the version to tag. container.py falls back to this image when no local build exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (default: _version.py)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V=$(python3 -c "exec(open('_version.py').read()); print(__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
